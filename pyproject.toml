[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jigsaws-skill-assessment"
version = "0.1.0"
description = "Unified, method-based skill assessment pipelines for the JIGSAWS dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
media = ["opencv-python>=4.8", "pillow>=10"]
ml = ["scikit-learn>=1.3", "joblib>=1.3", "hmmlearn>=0.3"]
plot = ["matplotlib>=3.8"]
all = [
    "opencv-python>=4.8",
    "pillow>=10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "hmmlearn>=0.3",
    "matplotlib>=3.8",
]

[project.scripts]
jigsaws = "jigsaws.cli:main"

[tool.setuptools.packages.find]
include = ["jigsaws*"]

[tool.setuptools.package-data]
jigsaws = ["py.typed"]
